<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Plapperwurm</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Plapperwurm">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=bb7489a73a87">
<body class="production-page">
<canvas id="starfield" aria-hidden="true"></canvas>
<main class="production-view">
  <section class="card" aria-label="Nachplappernder Papagei">
    <div class="worm-stage">
    <div id="voice-ring" class="voice-ring" aria-hidden="true">
      <svg viewBox="0 0 800 600" focusable="false">
        <g class="worm-tail"></g>
        <path class="ring-main" d="M248,160a88,88 0 1,0 -176,0a88,88 0 1,0 176,0Z"/>
        <path class="ring-echo" d="M255,160a95,95 0 1,0 -190,0a95,95 0 1,0 190,0Z"/>
        <path class="ring-halo" d="M262,160a102,102 0 1,0 -204,0a102,102 0 1,0 204,0Z"/>
      </svg>
    </div>
      <button id="start" class="play-overlay" aria-label="Start – Mikrofon aktivieren"><span aria-hidden="true">▶</span></button>
    </div>
    <div class="sr-only" role="status" aria-live="polite"><span id="status">Bereit, wenn du es bist.</span></div>
    <p id="hint" class="sr-only">Drück auf Start und sag etwas.<br>Nach einer kurzen Pause bin ich dran.</p>
    <div class="buttons"><button id="stop" aria-label="Stop" disabled><span aria-hidden="true">■</span></button></div>
  </section>
</main>
<script type="module" src="app.js?v=a952f094be24"></script>
<script type="module" src="stars.js?v=dcd6046c37d8"></script>
</body>
</html>
